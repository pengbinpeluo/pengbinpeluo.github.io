<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% if page.title %}{{ page.title }} · {% endif %}{{ site.title }}</title>
  <meta name="description" content="{{ page.description | default: site.description }}">
  <link rel="stylesheet" href="{{ '/assets/css/main.css' | relative_url }}">
  <link rel="icon" href="data:,">
</head>
<body>
  <header class="site-header">
    <div class="wrap">
      <a class="site-title" href="{{ '/' | relative_url }}">{{ site.title }}</a>
      <nav class="site-nav">
        <a href="{{ '/' | relative_url }}#bio">Bio</a>
        <a href="{{ '/experience/' | relative_url }}">Experience</a>
        <a href="{{ '/publications/' | relative_url }}">Publications</a>
        <a href="{{ '/engagement/' | relative_url }}">Engagement</a>
        <a href="{{ '/teaching/' | relative_url }}">Teaching</a>
        <a href="{{ '/hiring/' | relative_url }}">Hiring</a>
        <a href="{{ site.waci_lab_url }}">WACI Lab</a>
      </nav>
    </div>
  </header>

  <main class="wrap">
    {{ content }}
  </main>

  <footer class="site-footer">
    <div class="wrap">
      <div class="social-links">
        {% for s in site.social %}
          <a href="{{ s.url }}" target="_blank" rel="noopener">{{ s.name }}</a>{% unless forloop.last %} · {% endunless %}
        {% endfor %}
      </div>
      <p>&copy; {{ site.time | date: '%Y' }} {{ site.author.name }}. Built with Jekyll.</p>
    </div>
  </footer>

  <script>
    // Any link pointing off-site opens in a new tab, so visitors never
    // navigate away from this site by clicking a reference/journal/social link.
    document.querySelectorAll('a[href^="http"]').forEach(function (a) {
      if (a.hostname !== window.location.hostname) {
        a.target = '_blank';
        var rels = new Set((a.rel || '').split(/\s+/).filter(Boolean));
        rels.add('noopener');
        a.rel = Array.from(rels).join(' ');
      }
    });
  </script>
</body>
</html>
